name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app (ad-hoc signed)
        run: npm run tauri build -- --ci

      - name: Create DMG with uninstall-quarantine helper
        run: |
          APP_PATH="src-tauri/target/release/bundle/macos/Alchemist.app"
          STAGING="$(mktemp -d)"
          
          cp -R "$APP_PATH" "$STAGING/Alchemist.app"
          ln -s /Applications "$STAGING/Applications"
          
          cat > "$STAGING/🔓 Unlock-Alchemist.command" << 'SCRIPT'
          #!/bin/bash
          xattr -dr com.apple.quarantine /Applications/Alchemist.app 2>/dev/null
          echo ""
          echo "✅ Gatekeeper quarantine removed."
          echo "You can now open Alchemist from Applications."
          echo ""
          open -a Alchemist 2>/dev/null
          SCRIPT
          chmod +x "$STAGING/🔓 Unlock-Alchemist.command"
          
          DMG_PATH="src-tauri/target/release/bundle/dmg/Alchemist_aarch64.dmg"
          mkdir -p "$(dirname "$DMG_PATH")"
          hdiutil create -srcfolder "$STAGING" -volname "Alchemist" -fs HFS+ -format UDZO -size 50m "$DMG_PATH"
          rm -rf "$STAGING"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alchemist-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v")
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: src-tauri/target/release/bundle/dmg/*.dmg
          body: |
            ## Installation

            1. Open the DMG
            2. Drag **Alchemist** to **Applications**
            3. In the DMG, double-click **🔓 Unlock-Alchemist.command**
            4. Open Alchemist from Applications — no Gatekeeper warnings!

            **Why?** This build uses ad-hoc signing (no Apple Developer account). macOS flags ad-hoc-only apps from the internet. The unlock script removes this flag so it opens normally.

            Only install from the official [Witch Daddy Labs](https://github.com/witchdaddylabs/alchemist) release.
